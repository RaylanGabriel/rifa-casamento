<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Rifa de Casamento • Hemilly & Matheus</title>

<style>
:root {
    --rosa: #f7c6d0;
    --vinho: #8b2c3a;
    --dourado: #c9a24d;
    --cinza: #999;
    --fundo: #fff8f6;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #fff8f6, #fdecee);
    color: #4a2a2a;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.titulo {
    text-align: center;
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--vinho);
}

.subtitulo {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 20px;
}

.pix-box {
    background: white;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.pix-box span {
    font-size: 1.1rem;
    font-weight: 500;
}

.pix-btn {
    background: var(--dourado);
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
}

.pix-btn:hover {
    opacity: .9;
}

.premio {
    text-align: center;
    font-size: 1.4rem;
    margin: 20px 0;
    font-weight: 600;
}

.imagem-rifa {
    display: block;
    margin: 0 auto 25px;
    max-width: 90%;
    max-height: 300px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    transition: transform .3s;
}

.imagem-rifa:hover {
    transform: scale(1.03);
}

.imagem-rifa.ampliada {
    position: fixed;
    inset: 0;
    margin: auto;
    max-width: 95%;
    max-height: 95%;
    z-index: 9999;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 9998;
}

.numeros {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 12px;
    margin-top: 30px;
}

.numero {
    background: var(--rosa);
    color: var(--vinho);
    border-radius: 50%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: all .2s;
    border: 2px solid transparent;
}

.numero:hover {
    transform: scale(1.08);
}

.numero.vendido {
    background: var(--cinza);
    color: white;
    cursor: not-allowed;
    opacity: .6;
}
</style>
</head>

<body>

<div class="container">
    <div class="titulo">Hemilly & Matheus 💍</div>
    <div class="subtitulo">Nos ajude a realizar esse sonho ❤️</div>

    <div class="pix-box">
        <span>Chave Pix: <strong>hemillyematheuscasamento@gmail.com</strong></span>
        <button class="pix-btn" onclick="copyPix()">Copiar Pix</button>
    </div>

    <div class="premio">🎁 Prêmio: Pix de <strong>R$ 2.000,00</strong></div>

    <img 
        src="favicon.png"
        class="imagem-rifa"
        id="imgRifa"
        onclick="ampliarImagem()"
    >

    <div class="numeros" id="numeros"></div>
</div>

<script>
const totalNumeros = 100;
const API_URL = "https://script.google.com/macros/s/AKfycbxY2NtuWUzI1J8XLDVrTJrsnL-FHyVpqfP7zg499mfrS2PZ2GOG5-IRSCrdhXR0kh6YMw/exec";

const container = document.getElementById("numeros");
let numerosVendidos = [];

document.addEventListener("DOMContentLoaded", carregarNumeros);

async function carregarNumeros() {
    try {
        const res = await fetch(API_URL);
        numerosVendidos = await res.json();
        renderNumeros();
    } catch (e) {
        alert("Erro ao carregar números da rifa");
        console.error(e);
    }
}

function renderNumeros() {
    container.innerHTML = "";

    for (let i = 1; i <= totalNumeros; i++) {
        const div = document.createElement("div");
        div.className = "numero";
        div.innerText = i;

        const vendido = numerosVendidos.find(n => n.numero == i);

        if (vendido) {
            div.classList.add("vendido");
            div.onclick = () => {
                alert(`Número ${i}\nComprador: ${vendido.nome}`);
            };
        } else {
            div.onclick = async () => {
                const nome = prompt(`Digite o nome de quem comprou o número ${i}:`);
                if (!nome) return;

                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ numero: i, nome: nome.trim() })
                });

                carregarNumeros();
            };
        }

        container.appendChild(div);
    }
}

function copyPix() {
    navigator.clipboard.writeText("hemillyematheuscasamento@gmail.com");
    alert("Chave Pix copiada!");
}

function ampliarImagem() {
    const img = document.getElementById("imgRifa");
    const overlay = document.createElement("div");
    overlay.className = "overlay";

    overlay.onclick = () => {
        img.classList.remove("ampliada");
        overlay.remove();
    };

    img.classList.add("ampliada");
    document.body.appendChild(overlay);
}
</script>

</body>
</html>
