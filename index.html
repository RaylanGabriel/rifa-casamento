<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa de Casamento • Hemilly & Matheus</title>

<style>
:root {
    --rosa: #f7c6d0;
    --vinho: #8b2c3a;
    --dourado: #c9a24d;
    --cinza: #999;
    --fundo: #fff8f6;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #fff8f6, #fdecee);
    color: #4a2a2a;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.titulo {
    text-align: center;
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--vinho);
}

.subtitulo {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 20px;
}

.controles {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.busca-input {
    padding: 12px;
    width: 100%;
    max-width: 300px;
    border-radius: 25px;
    border: 2px solid var(--rosa);
    outline: none;
    text-align: center;
    font-size: 1rem;
}

.filtros {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

.btn-filtro {
    background: white;
    border: 1px solid var(--rosa);
    color: var(--vinho);
    padding: 8px 12px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.3s;
}

.btn-filtro.ativo {
    background: var(--vinho);
    color: white;
}

.pix-box {
    background: white;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.pix-btn {
    background: var(--dourado);
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}

.premio {
    text-align: center;
    font-size: 1.4rem;
    margin: 20px 0;
    font-weight: 600;
}

.contador {
    text-align: center;
    font-weight: bold;
    color: var(--vinho);
    margin-bottom: 15px;
}

.imagem-rifa {
    display: block;
    margin: 0 auto 25px;
    max-width: 90%;
    max-height: 250px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

.numeros {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
    gap: 10px;
}

.numero {
    background: var(--rosa);
    color: var(--vinho);
    border-radius: 50%;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    transition: all .2s;
}

.numero.vendido {
    background: var(--cinza);
    color: white;
    cursor: not-allowed;
    opacity: .6;
}
</style>
</head>
<body>

<div class="container">
    <div class="titulo">Hemilly & Matheus 💍</div>
    <div class="subtitulo">Nos ajude a realizar esse sonho ❤️</div>

    <div class="pix-box">
        <span>Chave Pix: <strong>hemillyematheuscasamento@gmail.com</strong></span>
        <button class="pix-btn" onclick="copyPix()">Copiar Pix</button>
    </div>

    <div class="premio">🎁 Prêmio: Pix de <strong>R$ 2.000,00</strong></div>
    
    <div class="contador" id="status-rifa">Carregando números...</div>

    <img src="favicon.png" class="imagem-rifa" id="imgRifa">

    <div class="controles">
        <input type="number" id="busca" class="busca-input" placeholder="🔍 Ir para o número...">
        
        <div class="filtros" id="filtros">
            <button class="btn-filtro ativo" onclick="filtrar(1, 100, this)">1-100</button>
            <button class="btn-filtro" onclick="filtrar(101, 200, this)">101-200</button>
            <button class="btn-filtro" onclick="filtrar(201, 300, this)">201-300</button>
            <button class="btn-filtro" onclick="filtrar(301, 400, this)">301-400</button>
            <button class="btn-filtro" onclick="filtrar(401, 500, this)">401-500</button>
            <button class="btn-filtro" onclick="filtrar(501, 600, this)">501-600</button>
            <button class="btn-filtro" onclick="filtrar(601, 700, this)">601-700</button>
            <button class="btn-filtro" onclick="filtrar(701, 800, this)">701-800</button>
            <button class="btn-filtro" onclick="filtrar(801, 900, this)">801-900</button>
            <button class="btn-filtro" onclick="filtrar(901, 1000, this)">901-1000</button>
        </div>
    </div>

    <div class="numeros" id="numeros"></div>
</div>

<script>
const totalNumeros = 1000;
const API_URL = "https://script.google.com/macros/s/AKfycbyo2QoTBYG7GDK8DXttK1LxLRwieCYTDgnL2-7dZoSDYoiQnV6B0Dt2GPeg_szMfqQMxA/exec"; 

const container = document.getElementById("numeros");
const statusRifa = document.getElementById("status-rifa");
let numerosVendidos = [];
let minAtual = 1;
let maxAtual = 100;

document.addEventListener("DOMContentLoaded", carregarNumeros);

document.getElementById('busca').addEventListener('input', function(e) {
    const num = parseInt(e.target.value);
    if (num > 0 && num <= totalNumeros) {
        const min = Math.floor((num - 1) / 100) * 100 + 1;
        const max = min + 99;
        
        const botoes = document.querySelectorAll('.btn-filtro');
        botoes.forEach(btn => {
            btn.classList.toggle('ativo', btn.innerText === `${min}-${max}`);
        });

        filtrar(min, max);
    }
});

async function carregarNumeros() {
    try {
        const res = await fetch(API_URL);
        numerosVendidos = await res.json();
        
        // Atualiza o contador
        const disponiveis = totalNumeros - numerosVendidos.length;
        statusRifa.innerText = `${disponiveis} números disponíveis de ${totalNumeros}`;
        
        renderNumeros(minAtual, maxAtual);
    } catch (e) {
        console.error("Erro ao carregar:", e);
        statusRifa.innerText = "Erro ao carregar dados.";
    }
}

function filtrar(min, max, btn) {
    minAtual = min;
    maxAtual = max;
    if (btn) {
        document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
    }
    renderNumeros(min, max);
}

function renderNumeros(min, max) {
    container.innerHTML = "";
    for (let i = min; i <= max; i++) {
        const div = document.createElement("div");
        div.className = "numero";
        div.innerText = i;

        const vendido = numerosVendidos.find(n => n.numero == i);

        if (vendido) {
            div.classList.add("vendido");
            div.onclick = () => alert(`Número ${i}\nComprador: ${vendido.nome}`);
        } else {
            div.onclick = async () => {
                const nome = prompt(`Nome para o número ${i}:`);
                if (!nome) return;
                div.innerText = "...";
                try {
                    await fetch(API_URL, {
                        method: "POST",
                        mode: 'no-cors',
                        body: JSON.stringify({ numero: i, nome: nome.trim() })
                    });
                    alert("Reserva enviada! Assim que confirmado o Pix, seu nome aparecerá aqui.");
                    setTimeout(carregarNumeros, 1500);
                } catch (e) {
                    alert("Erro ao salvar.");
                    renderNumeros(minAtual, maxAtual);
                }
            };
        }
        container.appendChild(div);
    }
}

function copyPix() {
    navigator.clipboard.writeText("hemillyematheuscasamento@gmail.com");
    alert("Pix copiado!");
}
</script>
</body>
</html>
